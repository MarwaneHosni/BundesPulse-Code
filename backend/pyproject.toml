[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bundespulse-backend"
version = "0.1.0"
description = "Deutschland Digital Monitor — read-only FastAPI backend over a pre-computed DuckDB snapshot"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "duckdb>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.5",
]

[tool.setuptools]
packages = ["backend", "backend.api", "backend.analytics", "backend.insights"]

[tool.setuptools.package-dir]
"backend" = "."

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
