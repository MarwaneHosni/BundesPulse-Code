services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    # The prepared snapshot (deutschland.duckdb + geojson + metadata) is baked
    # into the image — the API never contacts government services at runtime.
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./apps/web
      args:
        # Same origin via reverse proxy: the browser calls /api on :8080.
        VITE_API_BASE_URL: /api
    depends_on:
      - api
    ports:
      - "8080:80"